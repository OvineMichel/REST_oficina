<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Mecânica | Ordens de serviço</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#e2e8f0; --brand:#e85d2a; --brand-dark:#c84216; --bg:#f6f8fb; --card:#fff; --green:#14804a; --red:#b42318; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    header { background:linear-gradient(120deg,#182338,#263b61); color:#fff; padding:28px max(24px,calc((100% - 1180px)/2)); display:flex; justify-content:space-between; align-items:center; gap:20px; }
    header h1 { margin:0; font-size:clamp(1.35rem,3vw,2rem); } header p { color:#cbd5e1; margin:7px 0 0; }
    .logo { font-size:2.4rem; } main { max-width:1180px; margin:28px auto; padding:0 20px; } .layout { display:grid; grid-template-columns:360px 1fr; gap:24px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 18px #1720330b; padding:22px; } .card h2 { margin:0 0 18px; font-size:1.15rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; } label { display:flex; flex-direction:column; gap:6px; font-size:.78rem; font-weight:700; color:#475569; } label.full { grid-column:1/-1; }
    input,select,textarea { width:100%; border:1px solid #cbd5e1; border-radius:9px; padding:10px 11px; color:var(--ink); background:#fff; font:inherit; font-size:.9rem; } textarea { min-height:73px; resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:2px solid #fdba74; border-color:var(--brand); } .actions { display:flex; gap:9px; margin-top:18px; } button { border:0; border-radius:9px; padding:10px 15px; font:inherit; font-weight:750; cursor:pointer; } .primary { background:var(--brand); color:#fff; flex:1; } .primary:hover { background:var(--brand-dark); } .secondary { background:#eef2f7; color:#334155; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; } .toolbar h2 { margin:0; } #counter { background:#fff1eb; color:var(--brand-dark); padding:5px 10px; border-radius:20px; font-size:.78rem; font-weight:800; }
    .orders { display:grid; gap:12px; } .order { border:1px solid var(--line); border-radius:13px; padding:16px; display:grid; gap:11px; } .order-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; } .order h3 { margin:0; font-size:1rem; } .meta { margin-top:4px; color:var(--muted); font-size:.83rem; } .pill { font-size:.7rem; padding:5px 8px; border-radius:99px; font-weight:800; white-space:nowrap; } .aberta { background:#fff4cc; color:#866000; } .em_andamento { background:#dbeafe; color:#1d4ed8; } .concluida { background:#dcfce7; color:#166534; } .cancelada { background:#fee2e2; color:#991b1b; }
    .details { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; color:#475569; font-size:.82rem; } .details strong { color:var(--ink); display:block; font-size:.9rem; } .notes { background:#f8fafc; padding:9px; border-radius:8px; font-size:.8rem; color:#475569; } .order-actions { display:flex; gap:8px; border-top:1px solid var(--line); padding-top:11px; } .edit { color:#1d4ed8; background:#eff6ff; } .delete { color:var(--red); background:#fff1f0; } .empty { text-align:center; color:var(--muted); padding:40px 12px; border:1px dashed #cbd5e1; border-radius:12px; }
    #toast { position:fixed; right:20px; bottom:20px; padding:12px 16px; border-radius:9px; color:#fff; background:#172033; opacity:0; transform:translateY(10px); transition:.2s; pointer-events:none; } #toast.show { opacity:1; transform:none; } #toast.error { background:var(--red); }
    @media(max-width:850px){ .layout { grid-template-columns:1fr; } } @media(max-width:500px){ .grid,.details { grid-template-columns:1fr; } label.full { grid-column:auto; } header { align-items:flex-start; } .logo { display:none; } }
  </style>
</head>
<body>
<header><div><h1>Gestão da Oficina</h1><p>Ordens de serviço em um só lugar</p></div><div class="logo">⚙</div></header>
<main><div class="layout">
  <section class="card"><h2 id="form-title">Nova ordem de serviço</h2><form id="form"><div class="grid">
    <label>Cliente<input name="clienteNome" required placeholder="Nome completo"></label><label>Telefone<input name="clienteTelefone" required placeholder="(00) 00000-0000"></label>
    <label>Placa<input name="veiculoPlaca" required placeholder="ABC1D23" maxlength="7"></label><label>Modelo do veículo<input name="veiculoModelo" required placeholder="Ex.: Honda Civic 2020"></label>
    <label class="full">Serviço solicitado<input name="servico" required placeholder="Ex.: Troca de óleo"></label>
    <label>Status<select name="status"><option value="ABERTA">Aberta</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option><option value="CANCELADA">Cancelada</option></select></label>
    <label>Valor estimado (R$)<input name="valorEstimado" type="number" step="0.01" min="0" required placeholder="0,00"></label>
    <label>Data de entrada<input name="dataEntrada" type="date" required></label><label class="full">Observações<textarea name="observacoes" placeholder="Informações adicionais..."></textarea></label>
  </div><div class="actions"><button class="primary" type="submit" id="submit">Cadastrar ordem</button><button class="secondary" type="button" id="cancel" hidden>Cancelar</button></div></form></section>
  <section class="card"><div class="toolbar"><h2>Ordens registradas</h2><span id="counter">0 ordens</span></div><div id="orders" class="orders"><div class="empty">Carregando ordens...</div></div></section>
</div></main><div id="toast"></div>
<script>
const api='/api/ordens-servico'; let editingId=null; const $=s=>document.querySelector(s); const form=$('#form');
const today=new Date().toISOString().slice(0,10); form.dataEntrada.value=today;
function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className='show'+(error?' error':'');setTimeout(()=>t.className='',3000)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function statusLabel(s){return {ABERTA:'Aberta',EM_ANDAMENTO:'Em andamento',CONCLUIDA:'Concluída',CANCELADA:'Cancelada'}[s]||s}
async function load(){try{const res=await fetch(api);if(!res.ok)throw Error();const list=await res.json();$('#counter').textContent=`${list.length} ${list.length===1?'ordem':'ordens'}`;$('#orders').innerHTML=list.length?list.map(o=>`<article class="order"><div class="order-top"><div><h3>#${o.id} · ${esc(o.clienteNome)}</h3><div class="meta">${esc(o.veiculoModelo)} · ${esc(o.veiculoPlaca)}</div></div><span class="pill ${o.status.toLowerCase()}">${statusLabel(o.status)}</span></div><div class="details"><div>Serviço<strong>${esc(o.servico)}</strong></div><div>Entrada<strong>${o.dataEntrada}</strong></div><div>Estimativa<strong>${brl(o.valorEstimado)}</strong></div></div>${o.observacoes?`<div class="notes">${esc(o.observacoes)}</div>`:''}<div class="order-actions"><button class="edit" onclick="edit(${o.id})">Editar</button><button class="delete" onclick="removeOrder(${o.id})">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhuma ordem cadastrada ainda.</div>'}catch(e){toast('Não foi possível carregar a API.',true)}}
function data(){return Object.fromEntries(new FormData(form).entries())}
form.onsubmit=async e=>{e.preventDefault();const method=editingId?'PUT':'POST';try{const res=await fetch(editingId?`${api}/${editingId}`:api,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data())});if(!res.ok){const x=await res.json();throw Error(x.erro||'Confira os dados.')}toast(editingId?'Ordem atualizada!':'Ordem cadastrada!');reset();load()}catch(e){toast(e.message,true)}};
async function edit(id){const o=await (await fetch(`${api}/${id}`)).json();Object.entries(o).forEach(([k,v])=>{if(form[k])form[k].value=v??''});editingId=id;$('#form-title').textContent=`Editar ordem #${id}`;$('#submit').textContent='Salvar alterações';$('#cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}
async function removeOrder(id){if(!confirm(`Excluir a ordem #${id}?`))return;const res=await fetch(`${api}/${id}`,{method:'DELETE'});if(res.ok){toast('Ordem excluída.');load()}else toast('Não foi possível excluir.',true)}
function reset(){editingId=null;form.reset();form.dataEntrada.value=today;$('#form-title').textContent='Nova ordem de serviço';$('#submit').textContent='Cadastrar ordem';$('#cancel').hidden=true}$('#cancel').onclick=reset;load();
</script></body></html>
